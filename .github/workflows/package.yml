name: Package Python Support

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.87 --profile minimal --target "$TARGET"
          rustup override set 1.87
      - name: Test backend
        run: cargo test --locked --manifest-path backend/Cargo.toml
      - name: Assemble plugin archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
        run: |
          args=(--platform "$PLATFORM")
          if [[ -n "$TAG" ]]; then
            args+=(--expect-tag "$TAG")
          fi
          node scripts/package.mjs "${args[@]}"
      - name: Verify archive
        run: node --test --test-timeout=60000 scripts/package/archives.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: python-support-archive-${{ matrix.platform }}
          path: dist/python-support-*-${{ matrix.platform }}.zip
          if-no-files-found: error
