name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release.
# Lithe Store automatically tracks stable releases of eligible plugins.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ github.ref_name }}

  release:
    needs: [check, package]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: python-support-archive-*
          merge-multiple: true
          path: dist
      - name: Verify the six release archives
        env:
          LITHE_EXPECT_ALL_ARCHIVES: "1"
        run: node --test --test-timeout=60000 scripts/package/*.test.mjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # v1.0.0 requires a host that advertises toolchainProviders 0.
          PRERELEASE_TAGS: v0.1.0 v0.1.1 v1.0.0
        run: |
          release_flags=()
          installation='Lithe Store 会在收录后提供此版本。打开 设置 → 插件 → 插件市场，搜索 Python Support。'
          for tag in $PRERELEASE_TAGS; do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then
              release_flags+=(--prerelease)
              installation='下载对应平台的 ZIP。打开 设置 → 插件 → 从文件安装…，核对 SHA-256 后确认。'
              break
            fi
          done
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$notes"
          {
            cat "$notes"
            echo
            echo "$installation"
            echo
            echo 'SHA-256'
            echo
            echo '```'
            (cd dist && sha256sum ./*.zip)
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Python Support $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${release_flags[@]}"
